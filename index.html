<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0050aa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="PLU-listan"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>PLU-listan</title></head><body><main class="app"><header><div class="logo">✳</div><div><span class="eyebrow">MINA ARTIKLAR</span><h1>PLU-listan</h1></div></header><section class="intro"><div><h2>Hitta rätt nummer.</h2><p>Din egen smidiga lista för frukt & grönt.</p></div><div class="count"><strong id="count">0</strong><small>artiklar</small></div></section><div class="toolbar"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="Sök artikel eller PLU…" autocomplete="off"></label><button id="add" class="primary">＋ Lägg till</button></div><div class="list-heading"><h2>Artiklar</h2><span id="shown"></span></div><div id="list" class="list"></div><p class="foot">Sparas lokalt på den här enheten. Exportera en kopia om du vill behålla listan vid byte av telefon.</p><div class="backup"><button id="export" class="secondary">Exportera lista</button><button id="import" class="secondary">Importera lista</button><input id="file" type="file" accept="application/json,.json" hidden></div></main><dialog id="editor"><form id="form" method="dialog"><div class="dialog-head"><h2 id="form-title">Ny artikel</h2><button type="button" id="close" class="close" aria-label="Stäng">×</button></div><label>Artikelnamn<input id="name" maxlength="80" placeholder="T.ex. Banan" required></label><label>PLU-nummer<input id="plu" inputmode="numeric" pattern="[0-9]+" maxlength="12" placeholder="T.ex. 4011" required></label><div class="dialog-actions"><button type="button" id="cancel" class="secondary">Avbryt</button><button type="submit" class="primary">Spara artikel</button></div></form></dialog><dialog id="duplicate-dialog" aria-labelledby="duplicate-title"><div class="dialog-head"><h2 id="duplicate-title">PLU-numret finns redan!</h2></div><p id="duplicate-description" class="duplicate-description"></p><div class="duplicate-options"><button type="button" id="duplicate-replace" class="primary">Uppdatera befintlig artikel</button><button type="button" id="duplicate-keep" class="secondary">Behåll båda namnen</button><button type="button" id="duplicate-cancel" class="secondary">Avbryt</button></div></dialog><script src="app.js"></script></body></html>
