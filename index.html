<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0050aa"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Kassakollen"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Kassakollen</title></head>
<body><main class="app">
<header><div class="logo">✳</div><div class="brand"><span class="eyebrow">DIN ARTIKELHJÄLP</span><h1>Kassakollen</h1></div><button id="login-toggle" class="account" type="button">Logga in</button></header>
<nav class="tabs" aria-label="Välj artikellista"><button type="button" class="tab active" data-tab="plu" aria-pressed="true">PLU-listan</button><button type="button" class="tab" data-tab="other" aria-pressed="false">Övriga artiklar</button></nav>
<div class="toolbar"><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Sök artikel eller PLU…" autocomplete="off" aria-label="Sök artikel eller nummer"><button id="clear-search" class="clear-search" type="button" aria-label="Rensa sökfältet" hidden>×</button></div></div>
<div id="status" class="status" role="status">Ansluter till databasen…</div>
<section class="articles-panel" aria-label="Artikellista"><div class="list-heading"><h2 id="list-title">PLU-artiklar</h2><span id="shown">0 visas</span></div><div id="list" class="list" tabindex="0" aria-label="Bläddra bland artiklar"></div></section>
<button id="add" class="primary add-button" type="button" hidden>＋ Lägg till artikel</button>
<div id="admin-tools" class="admin-tools" hidden><button id="export" class="secondary" type="button">Exportera lista</button><button id="import" class="secondary" type="button">Importera JSON</button><button id="import-local" class="secondary" type="button" hidden>Flytta gamla PLU</button><input id="file" type="file" accept="application/json,.json" hidden></div>
</main>
<dialog id="login-dialog"><form id="login-form"><div class="dialog-head"><h2>Administratör</h2><button type="button" class="close" data-close="login-dialog" aria-label="Stäng">×</button></div><label>E-post<input id="email" type="email" autocomplete="username" required></label><label>Lösenord<input id="password" type="password" autocomplete="current-password" required></label><p id="login-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" data-close="login-dialog">Avbryt</button><button type="submit" class="primary">Logga in</button></div></form></dialog>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="form-title">Ny artikel</h2><button type="button" class="close" data-close="editor" aria-label="Stäng">×</button></div><label>Artikelnamn<input id="name" maxlength="80" placeholder="T.ex. Banan" required></label><label id="code-label">PLU-nummer<input id="plu" inputmode="numeric" pattern="[0-9]+" maxlength="20" placeholder="T.ex. 4011" required></label><p id="edit-error" class="error" role="alert"></p><div class="dialog-actions"><button type="button" class="secondary" data-close="editor">Avbryt</button><button type="submit" class="primary">Spara artikel</button></div></form></dialog>
<dialog id="duplicate-dialog"><div class="dialog-head"><h2>Numret finns redan!</h2></div><p id="duplicate-description" class="duplicate-description"></p><div class="duplicate-options"><button type="button" id="duplicate-replace" class="primary">Uppdatera befintlig artikel</button><button type="button" id="duplicate-keep" class="secondary">Behåll båda namnen</button><button type="button" id="duplicate-cancel" class="secondary">Avbryt</button></div></dialog>
<script type="module" src="app.js"></script></body></html>
